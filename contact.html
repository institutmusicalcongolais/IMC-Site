<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — Institut Musical Congolais</title>

    <meta
        name="description"
        content="Contactez l'Institut Musical Congolais."
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- =========================================================
     PAGE CONTACT
========================================================= -->

<main class="contact-page">

    <div class="contact-container">


        <!-- LOGO -->

        <a href="index.html" class="contact-logo">

            <img
                src="logo-imc.png"
                alt="Institut Musical Congolais"
            >

        </a>


        <!-- TITRE -->

        <span class="contact-label">
            CONTACT
        </span>

        <h1>
            Nous contacter
        </h1>


        <!-- LIENS -->

        <div class="contact-links">


            <!-- E-MAIL -->

            <a
                href="mailto:institutmusicalcongolais@gmail.com"
                class="contact-card"
            >

                <span class="contact-icon">✉️</span>

                <span>
                    E-mail
                </span>

            </a>


            <!-- FACEBOOK -->

            <a
                href="https://www.facebook.com/share/1Dj3EvZy29/"
                class="contact-card"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="contact-icon">f</span>

                <span>
                    Facebook
                </span>

            </a>


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/imc_off01?stkn=MTNrY2s3eTlsYzJ4MA=="
                class="contact-card"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="contact-icon">◎</span>

                <span>
                    Instagram
                </span>

            </a>


            <!-- X -->

            <a
                href="https://x.com/IMC_off01"
                class="contact-card"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="contact-icon">𝕏</span>

                <span>
                    X
                </span>

            </a>


        </div>

    </div>

</main>



<!-- =========================================================
     BAS DE PAGE
========================================================= -->

<section class="bottom">

    <div class="bottom-name">
        INSTITUT MUSICAL CONGOLAIS
    </div>

    <div class="bottom-motto">
        Mesurer. Certifier. Valoriser.
    </div>

    <div class="copyright">
        © 2026 Institut Musical Congolais
    </div>

</section>


</body>
</html>
